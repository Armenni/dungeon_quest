[pytest]
# pytest configuration for Dungeon Quest

testpaths = tests/unit
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -v
    --tb=short

# Markers for categorizing tests (if needed later)
markers =
    integration: Integration tests (slow, full game flow)
    unit: Unit tests (fast, isolated)
    combat: Combat mechanic tests
    player: Player mechanic tests
